name: Street Arena gameplay core tests
on:
  push:
    branches:
      - prototype/street-arena-cloud-20261022
    paths:
      - 'street-arena/**'
      - '.github/workflows/street-arena-tests.yml'
  pull_request:
    paths:
      - 'street-arena/**'
  workflow_dispatch:
jobs:
  simulation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript parse
        run: |
          node --check street-arena/simulation.js
          node --check street-arena/gameplay-bridge.js
          node --check street-arena/game.js
          node --check street-arena/simulation-v03.js
          node --check street-arena/gameplay-bridge-v03.js
          node --check street-arena/character-motion.js
          node --check street-arena/character-rig.js
          node --check street-arena/court-config.js
          node --check street-arena/court-scene.js
          node --check street-arena/tennis/tennis-sim.js
          node --check street-arena/tennis/tennis-feel.js
          node --check street-arena/tennis/tennis-scene.js
          node --check street-arena/tennis/tennis.js
      - name: Run physics and controls tests
        run: |
          npm test --prefix street-arena
          node --test street-arena/tennis/*.test.mjs
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser in GitHub cloud runner
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Serve static prototype and check live gameplay
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory street-arena >/tmp/matchmake-http.log 2>&1 &
          node street-arena/browser-smoke.mjs
          node street-arena/tennis/browser-test.mjs
      - name: Upload animation screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-arena-animation-smoke
          path: |
            street-arena/animated-players-smoke.png
            street-arena/tennis/tennis-browser-smoke.png
          if-no-files-found: ignore
