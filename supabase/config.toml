
# Crea preferencias de Mercado Pago. Requiere JWT del usuario.
# Secrets: MP_ACCESS_TOKEN
[functions.create_preference]
enabled = true
verify_jwt = true
entrypoint = "./functions/create_preference/index.ts"

# Webhook de Mercado Pago. Sin JWT (MP no lo envía); se valida x-signature.
# Secrets: MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET
[functions.mp_webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/mp_webhook/index.ts"

[functions.notify_onesignal]
enabled = true
verify_jwt = true
import_map = "./functions/notify_onesignal/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/notify_onesignal/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/notify_onesignal/*.html" ]
